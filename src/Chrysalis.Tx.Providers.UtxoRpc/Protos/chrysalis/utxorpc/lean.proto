syntax = "proto3";
package chrysalis.utxorpc;
option csharp_namespace = "Chrysalis.Tx.Providers.Lean";

message LeanTxoRef {
  bytes hash = 1;
  uint32 index = 2;
}
message LeanUtxo {
  bytes native_bytes = 1;
  LeanTxoRef txo_ref = 2;
}
message LeanUtxosResponse {
  repeated LeanUtxo items = 1;
  optional string next_token = 3;
}
message LeanTx {
  bytes native_bytes = 1;
}
message LeanReadTxResponse {
  LeanTx tx = 1;
}
