name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - '*.slnx'
              - '.editorconfig'
              - 'Directory.*.props'
              - 'Directory.Build.targets'
              - 'global.json'
              - 'NuGet.Config'
              - 'scripts/test-manifest.py'
              - '.github/workflows/ci.yml'

      - name: Setup .NET 10
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        if: steps.changes.outputs.code == 'true'
        run: dotnet --version

      - name: Restore
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore

      - id: plc
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/corpora"
          tree=$(jq -er .tree.id src/Chrysalis.Plutus.Test/conformance.json)
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.changes.outputs.code == 'true'
        with:
          path: ${{ runner.temp }}/corpora/plutus-conformance/${{ steps.plc.outputs.tree }}
          key: plutus-conformance-${{ steps.plc.outputs.tree }}

      - env:
          CHRYSALIS_CORPORA: ${{ runner.temp }}/corpora
        if: steps.changes.outputs.code == 'true'
        run: python3 src/Chrysalis.Plutus.Test/fetch_conformance.py

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build --no-restore -warnaserror

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: dotnet format --no-restore --verify-no-changes

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: dotnet test --no-build --no-restore --filter "Category!=Integration" --logger trx --results-directory out/test-results

      - name: Pack (dry run)
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p out
          for proj in src/Chrysalis*/Chrysalis*.csproj; do
            if grep -q '<IsPackable>false</IsPackable>' "$proj" 2>/dev/null || \
               grep -q '<IsTestProject>true</IsTestProject>' "$proj" 2>/dev/null || \
               echo "$proj" | grep -qi "cli"; then
              continue
            fi
            echo "Packing $proj..."
            dotnet pack "$proj" -c Release -o out
          done
          echo "Packed $(ls out/*.nupkg | wc -l) packages:"
          ls -la out/*.nupkg

      - name: Skip reason
        if: steps.changes.outputs.code != 'true'
        run: echo "No source code changes detected — skipping build/test/pack."
